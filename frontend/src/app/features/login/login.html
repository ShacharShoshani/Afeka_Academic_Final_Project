<div class="page">
  <header class="header">
    <span class="brand">Livin</span>
  </header>

  <div class="content">
    <div class="brand-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <ellipse cx="8" cy="7" rx="1.8" ry="2.3" fill="currentColor"/>
        <ellipse cx="16" cy="7" rx="1.8" ry="2.3" fill="currentColor"/>
        <ellipse cx="5" cy="11.5" rx="1.5" ry="2" fill="currentColor"/>
        <ellipse cx="19" cy="11.5" rx="1.5" ry="2" fill="currentColor"/>
        <path d="M7.5 16c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4-2 4-4.5 4-4.5-1.5-4.5-4z" fill="currentColor"/>
      </svg>
    </div>

    <h1 class="title">Welcome back</h1>
    <p class="subtitle">Log in to keep caring for pets, plants &amp; strays.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form" novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="your@email.com"
          autocomplete="email"
          [class.input-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')) {
          <span class="field-error">Please enter a valid email</span>
        }
      </div>

      <div class="form-field">
        <div class="label-row">
          <label for="password">Password</label>
          <a class="forgot-link" routerLink="/forgot-password">Forgot?</a>
        </div>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-btn" (click)="toggleShowPassword()"
                  [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 1l22 22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
            }
          </button>
        </div>
      </div>

      @if (apiError()) {
        <p class="api-error" role="alert">{{ apiError() }}</p>
      }

      <button type="submit" class="submit-btn" [disabled]="!canSubmit()">
        @if (loading()) {
          Logging in…
        } @else {
          Log in
          <span aria-hidden="true">&rarr;</span>
        }
      </button>
    </form>

    <p class="switch-link">New to Livin? <a routerLink="/register">Create an account</a></p>
  </div>
</div>
