<div class="page">
  <header class="header">
    <span class="brand">Livin</span>
  </header>

  <div class="content">
    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
    </svg>

    <h1 class="title">Welcome back!</h1>
    <p class="subtitle">Log in to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form">
      <div class="form-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="your@email.com"
          autocomplete="email"
        />
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')) {
          <span class="field-error">Please enter a valid email</span>
        }
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-btn" (click)="toggleShowPassword()">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 1l22 22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
            }
          </button>
        </div>
      </div>

      @if (apiError()) {
        <p class="api-error">{{ apiError() }}</p>
      }

      <button
        type="submit"
        class="submit-btn"
        [disabled]="!canSubmit()"
      >
        @if (loading()) {
          Logging in...
        } @else {
          Log In
          <span aria-hidden="true">&rarr;</span>
        }
      </button>
    </form>

    <p class="switch-link">
      Don't have an account? <a routerLink="/register">Sign up</a>
    </p>
    <p class="switch-link">
      <a routerLink="/forgot-password">Forgot password?</a>
    </p>
  </div>
</div>
