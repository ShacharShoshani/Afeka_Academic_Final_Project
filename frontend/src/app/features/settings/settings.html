<div class="page">
  <header class="header">
    <button class="back-btn" (click)="goHome()">
      <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Home</span>
    </button>
    <span class="title">Settings</span>
    <span class="header-spacer"></span>
  </header>

  <main class="content">
    <section class="setting-section">
      <h2 class="section-title">Browse mode</h2>
      <p class="section-desc">Choose how you discover other users on Livin.</p>

      <div class="mode-cards">
        <button
          class="mode-card"
          [class.active]="currentMode() === 'social'"
          (click)="selectMode('social')"
        >
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="mode-name">Social</span>
          <span class="mode-desc">Browse a grid of profiles and filter by care type, availability, and location.</span>
          @if (currentMode() === 'social') {
            <span class="mode-check">✓ Active</span>
          }
        </button>

        <button
          class="mode-card"
          [class.active]="currentMode() === 'swipe'"
          (click)="selectMode('swipe')"
        >
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none">
            <rect x="4" y="2" width="16" height="20" rx="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 12l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="mode-name">Swipe</span>
          <span class="mode-desc">See one profile at a time. Swipe right to connect, left to skip. A mutual match opens a chat.</span>
          @if (currentMode() === 'swipe') {
            <span class="mode-check">✓ Active</span>
          }
        </button>
      </div>
    </section>
  </main>
</div>
