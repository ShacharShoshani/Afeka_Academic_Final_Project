<div class="chips" role="group" [attr.aria-label]="ariaLabel()">
  <button type="button" class="chip" [class.selected]="isOn('dogs')" [attr.aria-pressed]="isOn('dogs')" (click)="toggle.emit('dogs')">
    <svg class="chip-icon" viewBox="0 0 24 24" fill="none"><path d="M18 4c-1.5 0-3 1.5-3 3v2H9V7c0-1.5-1.5-3-3-3S3 5.5 3 7v4c0 4.4 3.6 8 8 8h2c4.4 0 8-3.6 8-8V7c0-1.5-1.5-3-3-3z" fill="currentColor"/><circle cx="9" cy="12" r="1.5" fill="var(--color-white)"/><circle cx="15" cy="12" r="1.5" fill="var(--color-white)"/></svg>
    Dogs
  </button>
  <button type="button" class="chip" [class.selected]="isOn('cats')" [attr.aria-pressed]="isOn('cats')" (click)="toggle.emit('cats')">
    <svg class="chip-icon" viewBox="0 0 24 24" fill="none"><path d="M12 22c-4.4 0-8-2.5-8-7 0-3 1.5-5.5 3-7l1-4 3 2h2l3-2 1 4c1.5 1.5 3 4 3 7 0 4.5-3.6 7-8 7z" fill="currentColor"/><path d="M4 4l3 4M20 4l-3 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9.5" cy="13" r="1.2" fill="var(--color-white)"/><circle cx="14.5" cy="13" r="1.2" fill="var(--color-white)"/><ellipse cx="12" cy="15.5" rx="1" ry="0.7" fill="var(--color-white)"/></svg>
    Cats
  </button>
  <button type="button" class="chip" [class.selected]="isOn('birds')" [attr.aria-pressed]="isOn('birds')" (click)="toggle.emit('birds')">
    <svg class="chip-icon" viewBox="0 0 24 24" fill="none"><path d="M20.5 5.5c-1.5-1.5-4-1.5-5.5 0L12 8.5 9 5.5C7.5 4 5 4 3.5 5.5S2 9.5 3.5 11L12 19.5l8.5-8.5c1.5-1.5 1.5-4 0-5.5z" fill="currentColor"/><circle cx="7" cy="8" r="1" fill="var(--color-white)"/><path d="M12 19.5V22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9 22h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    Birds
  </button>
  <button type="button" class="chip" [class.selected]="isOn('fish')" [attr.aria-pressed]="isOn('fish')" (click)="toggle.emit('fish')">
    <svg class="chip-icon" viewBox="0 0 24 24" fill="none"><path d="M2 12c3-4 7-6 12-6 2 0 3.5.5 5 1.5L22 12l-3 4.5c-1.5 1-3 1.5-5 1.5-5 0-9-2-12-6z" fill="currentColor"/><circle cx="17" cy="11" r="1.2" fill="var(--color-white)"/><path d="M2 12c1.5-1.5 2-3 2-5M2 12c1.5 1.5 2 3 2 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    Fish
  </button>
  <button type="button" class="chip" [class.selected]="isOn('rabbits')" [attr.aria-pressed]="isOn('rabbits')" (click)="toggle.emit('rabbits')">
    <svg class="chip-icon" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="16" rx="6" ry="5" fill="currentColor"/><path d="M9 11V4c0-1 .5-2 1.5-2S12 3 12 4v7M12 11V5c0-1 .5-2 1.5-2S15 3 15 4v7" fill="currentColor"/><circle cx="10" cy="15" r="1" fill="var(--color-white)"/><circle cx="14" cy="15" r="1" fill="var(--color-white)"/><ellipse cx="12" cy="17" rx="0.8" ry="0.6" fill="var(--color-white)"/></svg>
    Rabbits
  </button>
  <button type="button" class="chip" [class.selected]="isOn('hamsters')" [attr.aria-pressed]="isOn('hamsters')" (click)="toggle.emit('hamsters')">
    <svg class="chip-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="7" fill="currentColor"/><circle cx="6" cy="9" r="2.5" fill="currentColor"/><circle cx="18" cy="9" r="2.5" fill="currentColor"/><circle cx="9.5" cy="12" r="1.2" fill="var(--color-white)"/><circle cx="14.5" cy="12" r="1.2" fill="var(--color-white)"/><ellipse cx="12" cy="14.5" rx="1" ry="0.7" fill="var(--color-white)"/></svg>
    Hamsters
  </button>
  <button type="button" class="chip" [class.selected]="isOn('reptiles')" [attr.aria-pressed]="isOn('reptiles')" (click)="toggle.emit('reptiles')">
    <svg class="chip-icon" viewBox="0 0 24 24" fill="none"><path d="M4 12c0-3 2-6 5-7l2-1 2 1c3 1 5 4 5 7v3c0 2-1.5 3.5-3.5 3.5S12 17 12 15v-1c0-2-1.5-3.5-3.5-3.5h-1C5.5 10.5 4 12 4 14" fill="currentColor"/><circle cx="9" cy="8" r="0.8" fill="var(--color-white)"/><circle cx="14" cy="8" r="0.8" fill="var(--color-white)"/></svg>
    Reptiles
  </button>
  <button type="button" class="chip" [class.selected]="isOn('plants')" [attr.aria-pressed]="isOn('plants')" (click)="toggle.emit('plants')">
    <svg class="chip-icon" viewBox="0 0 24 24" fill="none"><path d="M12 22V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 12c0-4 3-7 7-8-1 4-4 7-7 8z" fill="currentColor"/><path d="M12 15c0-3-2.5-5.5-6-6.5 1 3.5 3.5 5.5 6 6.5z" fill="currentColor"/><path d="M10 22h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Plants
  </button>
  <button type="button" class="chip" [class.selected]="isOn('stray_animals')" [attr.aria-pressed]="isOn('stray_animals')" (click)="toggle.emit('stray_animals')">
    <svg class="chip-icon" viewBox="0 0 24 24" fill="none"><ellipse cx="8" cy="7" rx="1.8" ry="2.2" fill="currentColor"/><ellipse cx="16" cy="7" rx="1.8" ry="2.2" fill="currentColor"/><ellipse cx="5" cy="11.5" rx="1.5" ry="2" fill="currentColor"/><ellipse cx="19" cy="11.5" rx="1.5" ry="2" fill="currentColor"/><path d="M8 16c0-2.2 1.8-4 4-4s4 1.8 4 4-1.8 4-4 4-4-1.8-4-4z" fill="currentColor"/></svg>
    Stray Animals
  </button>
</div>
