<header class="navbar">
  <a class="brand" routerLink="/home">Livin</a>
  <nav class="nav-links">
    <a class="nav-link" routerLink="/home" routerLinkActive="nav-link--active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a class="nav-link" routerLink="/browse" routerLinkActive="nav-link--active">Browse</a>
    <a class="nav-link" routerLink="/jobs" routerLinkActive="nav-link--active">Jobs</a>
    <a class="nav-link" routerLink="/connections" routerLinkActive="nav-link--active">Connections</a>
    <a class="nav-link" routerLink="/settings" routerLinkActive="nav-link--active">Settings</a>
  </nav>
  <a class="bell-btn" routerLink="/notifications" aria-label="Notifications">
    <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    @if (notificationService.unreadCount() > 0) {
      <span class="bell-badge">{{ notificationService.unreadCount() > 9 ? '9+' : notificationService.unreadCount() }}</span>
    }
  </a>
  <button class="logout-btn" (click)="logout()">Log out</button>
</header>
