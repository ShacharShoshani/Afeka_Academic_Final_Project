<a class="swipe-bell" routerLink="/notifications" aria-label="Notifications">
  <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  @if (notificationService.unreadCount() > 0) {
    <span class="swipe-bell-badge">{{ notificationService.unreadCount() > 9 ? '9+' : notificationService.unreadCount() }}</span>
  }
</a>

<nav class="swipe-nav">
  <a class="tab" routerLink="/settings" routerLinkActive="tab--active">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" width="24" height="24">
      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.2.61.78 1.05 1.51 1.05H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="tab-label">Settings</span>
  </a>

  <a class="tab" routerLink="/home" routerLinkActive="tab--active">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" width="24" height="24">
      <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6" />
      <path d="M4 20c0-4 3.582-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
    <span class="tab-label">Profile</span>
  </a>

  <a class="tab tab--primary" routerLink="/swipe" routerLinkActive="tab--active">
    <span class="tab-fab">
      <svg viewBox="0 0 24 24" fill="none" width="26" height="26">
        <path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 1.9 4.5 5.6 4.5c2 0 3.4 1.1 4.4 2.6 1-1.5 2.4-2.6 4.4-2.6 3.7 0 5.2 3.9 3.6 7.2C19.5 16.4 12 21 12 21z" fill="currentColor" />
      </svg>
    </span>
    <span class="tab-label">Search</span>
  </a>

  <a class="tab" routerLink="/connections" routerLinkActive="tab--active">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" width="24" height="24">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="tab-label">Chats</span>
  </a>

  <a class="tab" routerLink="/my-jobs" routerLinkActive="tab--active">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" width="24" height="24">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="tab-label">Jobs</span>
  </a>
</nav>
