@if (visible() && match) {
  <div class="toast" role="status" aria-live="polite" (click)="goToChats()">
    @if (match.otherUser.photo) {
      <img class="toast-photo" [src]="match.otherUser.photo" [alt]="match.otherUser.name" />
    } @else {
      <div class="toast-photo toast-photo-placeholder">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 20c0-4 3.582-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    }
    <div class="toast-body">
      <span class="toast-title">💚 New match!</span>
      <span class="toast-sub">You and <strong>{{ match.otherUser.name }}</strong> matched. Tap to chat.</span>
    </div>
    <button class="toast-close" (click)="$event.stopPropagation(); dismiss()" aria-label="Dismiss">✕</button>
  </div>
}
